[project]
name = "house-ear"
version = "0.0.1"
description = "Self-hosted voice endpoint for SSH-enabled smart speakers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "numpy>=1.26",
    "psutil>=5.9",
    "websockets>=13",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pypinyin>=0.55.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
# Wake word. Optional because it is a 30 MB wheel and the plane degrades cleanly
# (KWS off, everything else runs) when it is absent.
kws = ["sherpa-onnx>=1.12"]

[project.scripts]
house-ear = "house_ear.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/house_ear"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
