[project]
name = "rui"
version = "0.8.13"
description = "Self-hosted voice endpoint for SSH-enabled smart speakers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "numpy>=1.26",
    "psutil>=5.9",
    "websockets>=13",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pypinyin>=0.55.0",
    "segno>=1.6",
    "socksio>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "httpx>=0.27", "ruff>=0.5"]
# Wake word. Optional because it is a 30 MB wheel and the plane degrades cleanly
# (KWS off, everything else runs) when it is absent.
kws = ["sherpa-onnx>=1.12"]
# Text/voice channels. Telegram uses httpx only; WeChat media needs AES + SILK.
channels = ["cryptography>=42"]
# WeChat voice notes need the pilk SILK decoder. Kept separate because pilk may build
# from source and is not needed for Telegram-only or text-only deployments.
weixin-voice = ["pilk>=0.2.4"]

[project.scripts]
rui = "rui.__main__:main"
rui-channels = "rui.channels.cli:main"
rui-healthcheck = "rui.healthcheck:main"
rui-plug-test = "rui.plugins.contract:main"
# Device-adapter conformance kit for third-party bridge authors (docs/bridge-developer/).
rui-adapter-check = "rui.device.adapter_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The frozen LX06 plug used by the core test-suite lives under
# tests/fixtures/legacy_lx06 (the image no longer ships it; 0.7.6-b ports these tests
# to rui-xiaoai-bridge). src stays first so rui itself is always the source tree.
pythonpath = ["src", "tests/fixtures/legacy_lx06"]
