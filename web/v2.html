<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1efe9" />
    <meta name="description" content="Rui console v2 — device-centric, read-only device domain (M1)" />
    <title>Rui · Console v2</title>
    <script>
      // Same early bootstrap as the legacy shell: theme + language before first
      // paint, so /v2 does not flash the wrong mode or language.
      (function () {
        try {
          var theme = localStorage.getItem('rui-theme') || 'auto'
          var dark = theme === 'dark' ||
            (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var lang = localStorage.getItem('rui-language')
          if (!lang) lang = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'
          document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="v2-app"></div>
    <script type="module" src="/src/v2/main.ts"></script>
  </body>
</html>
