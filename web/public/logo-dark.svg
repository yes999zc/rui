<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!--
    Rui mark (dark palette), the dark-theme twin of public/logo.svg. Same
    8-rect geometry as the legacy console's src/components/BrandMark.vue; colours
    are the dark theme tokens (accent #63c7b8, live #f0b36b, line-strong #3c463f).
    Keep the two files in sync.
  -->
  <style>
    .packet { opacity: 0; animation: packet-flow 2.2s steps(5, end) infinite; }
    .p2 { animation-delay: 0.73s; }
    .p3 { animation-delay: 1.46s; }
    .node-end { animation: node-blink 2.2s steps(2, end) infinite; }

    @keyframes packet-flow {
      0% { opacity: 0; transform: translateX(0); }
      14% { opacity: 1; }
      62% { opacity: 1; transform: translateX(6px); }
      78%, 100% { opacity: 0; transform: translateX(7px); }
    }

    @keyframes node-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .packet, .node-end { animation: none; }
      .p1 { opacity: 0.85; }
      .p2 { opacity: 0.7; transform: translateX(2px); }
      .p3 { opacity: 0.55; transform: translateX(4px); }
    }
  </style>
  <!-- sound / ear side -->
  <rect x="3" y="13" width="3" height="6" fill="#63c7b8" opacity=".55"/>
  <rect x="8" y="9" width="3" height="14" fill="#63c7b8"/>
  <rect x="13" y="11" width="3" height="10" fill="#63c7b8" opacity=".78"/>
  <!-- data rail and nodes -->
  <rect x="18" y="15" width="10" height="2" fill="#3c463f"/>
  <rect x="17" y="13" width="4" height="6" fill="#63c7b8"/>
  <rect class="node-end" x="27" y="12" width="4" height="8" fill="#f0b36b"/>
  <!-- packets travel left -> right along the rail -->
  <rect class="packet p1" x="19" y="14" width="3" height="4" fill="#f0b36b"/>
  <rect class="packet p2" x="19" y="14" width="3" height="4" fill="#f0b36b"/>
  <rect class="packet p3" x="19" y="14" width="3" height="4" fill="#f0b36b"/>
</svg>
