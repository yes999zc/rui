# Dated allowlist for container-image vulnerabilities that Debian 12 (bookworm)
# has not fixed as of 2026-10-24. Trivy stops ignoring an entry after
# `expired_at`, so the finding comes back and the image-scan job fails until the
# entry is reviewed and renewed (or the base image is bumped).
#
# Rules (see docs/security-scanning.md):
#   - one entry per CVE, never a wildcard;
#   - statement must say why the risk is accepted now and what would remove it;
#   - expiry must be <= 90 days; do not renew mechanically.
#   - prune entries as soon as the rebuilt base image no longer reports them.
#
# Source: trivy v0.76.1, python:3.12-slim-bookworm (Debian 12.15), DB 2026-10-24.
# The runtime image inherits this base and adds libspeexdsp1, the Python
# dependencies, web assets and the static ffmpeg binary.
vulnerabilities:
  # util-linux 2.38.1-5+deb12u3: six CVEs affecting bsdutils, libblkid1,
  # libmount1, libsmartcols1, libuuid1, mount, util-linux, util-linux-extra.
  - id: CVE-2026-53613
    statement: "util-linux mount TOCTOU; Debian 12 package is unfixed. The container does not expose mount to untrusted callers."
    expired_at: 2027-01-23
  - id: CVE-2026-53615
    statement: "util-linux partition-metadata integer overflow; Debian 12 package is unfixed. No block-device operations are exposed by the service."
    expired_at: 2027-01-23
  - id: CVE-2026-76642
    statement: "util-linux external mount helper handling; Debian 12 package is unfixed. No mount helpers run in the runtime container."
    expired_at: 2027-01-23
  - id: CVE-2026-78408
    statement: "util-linux nsenter cgroup leak; Debian 12 package is unfixed. The service does not invoke nsenter."
    expired_at: 2027-01-23
  - id: CVE-2026-78409
    statement: "util-linux X-mount.subdir resolution; Debian 12 package is unfixed. Mount operations are not part of the request path."
    expired_at: 2027-01-23
  - id: CVE-2026-78410
    statement: "util-linux restricted bind-mount pinning; Debian 12 package is unfixed. The container does not perform bind mounts at runtime."
    expired_at: 2027-01-23

  - id: CVE-2026-41992
    statement: "gzip LZH buffer overflow; Debian 12 gzip 1.12-1 is unfixed. No gzip decompression of untrusted uploads is exposed."
    expired_at: 2027-01-23

  - id: CVE-2026-54369
    statement: "libacl symlink traversal; Debian 12 libacl1 2.3.1-3 is unfixed. The service does not grant filesystem access to untrusted local users."
    expired_at: 2027-01-23

  - id: CVE-2025-69720
    statement: "ncurses buffer overflow; Debian 12 ncurses 6.4-4 is unfixed. The runtime service is non-interactive and does not read untrusted terminal data."
    expired_at: 2027-01-23

  - id: CVE-2025-7458
    statement: "SQLite integer overflow; Debian 12 libsqlite3-0 3.40.1-2+deb12u2 is unfixed. No application path executes untrusted SQL."
    expired_at: 2027-01-23
  - id: CVE-2026-11822
    statement: "SQLite FTS5 arbitrary code execution; Debian 12 libsqlite3-0 is unfixed. The service does not enable FTS5 on untrusted input."
    expired_at: 2027-01-23
  - id: CVE-2026-11824
    statement: "SQLite heap buffer overflow; Debian 12 libsqlite3-0 is unfixed. No application path executes untrusted SQL."
    expired_at: 2027-01-23

  - id: CVE-2026-84782
    statement: "OpenSSL DTLS information disclosure; Debian 12 libssl3/openssl 3.0.22-1~deb12u1 is unfixed. The container does not terminate inbound TLS."
    expired_at: 2027-01-23

  - id: CVE-2026-16742
    statement: "systemd-homed local privilege escalation; Debian 12 systemd 252.39-1~deb12u2 is unfixed. systemd-homed is not used in this container."
    expired_at: 2027-01-23

  - id: CVE-2026-9538
    statement: "Perl Archive::Tar denial of service; Debian 12 perl-base is unfixed. The application does not invoke Perl on untrusted archives."
    expired_at: 2027-01-23

  - id: CVE-2023-45853
    statement: "MiniZip integer overflow; Debian marks zlib 1:1.2.13.dfsg-1 will_not_fix because the vulnerable code is MiniZip, not zlib. Base package only."
    expired_at: 2027-01-23
