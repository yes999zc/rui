name: docker-publish

# The deploy path pulls an image from GHCR, so something has to publish it. Until now CI
# only built (`push: false`), which left install.sh pointing at a tag nobody wrote.
#
# Tags:
#   main        -> :latest and :sha-<12 chars>     (rolling; what install.sh gets)
#   v1.2.3      -> :1.2.3, :1.2, :latest and :sha-<12 chars>
#   other refs  -> :edge and :sha-<12 chars>
# Roll back by deploying a previous tag or its digest; see docs/runbook.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Gate: a tag/main push must pass the same lint + tests as ci.yml before anything is
  # published. Keep this in sync with the `test` job there (Python 3.12 here because that
  # is the interpreter in the runtime image).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=house-ear
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
