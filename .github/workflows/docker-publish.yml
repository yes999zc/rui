name: docker-publish

# The deploy path pulls an image from GHCR, so something has to publish it. Until now CI
# only built (`push: false`), which left install.sh pointing at a tag nobody wrote.
#
# Tags:
#   v1.2.3      -> :1.2.3, :1.2, :latest and :sha-<7 chars>    (the only way :latest moves)
#   main        -> :edge and :sha-<7 chars>      (rolling; never :latest)
#   other refs  -> :edge and :sha-<7 chars>
# Roll back by deploying a previous tag or its digest; see docs/runbook.md.
#
# :latest is tag-only on purpose. It used to be `enable={{is_default_branch}}`, so any
# commit on main republished :latest while the release tag :0.8.12 still pointed at a
# different digest — 0.8.12 shipped, then a docs-only commit 42f663d moved :latest to a
# second image (version=main, revision=42f663d). install.sh pulls :latest, so a
# documentation fix silently changed what new installs ran, and pinning a digest from
# the release note no longer described what :latest returned. main now rolls :edge
# (and :sha-<7>), which nobody installs by accident; :latest only ever names a
# released vX.Y.Z.
#
# Docs-only pushes do not build at all. The paths-ignore below skips `docs/**` and any
# `**.md` change, which is where that docs-only push and five of the day's scan reds
# came from. Trade-off, stated because it is real: README.md is COPY'd into the image
# (Dockerfile line 166), so a README-only edit is picked up by the next code push
# rather than published on its own — the file is metadata, not runtime behaviour, and a
# rebuild costs ~40 min of FFmpeg compile on both architectures. Nothing under src/,
# web/, deploy/, scripts/, pyproject.toml, uv.lock or the Dockerfile matches these
# patterns, so a real code change still builds. Note that GitHub does not evaluate path
# filters for tag pushes, so cutting a release tag always builds.
#
# The `test` job is a gate, not a formality: it refuses to publish when the tag name
# disagrees with pyproject's version (release 0.8.13 off a 0.8.12 tree) and it re-runs
# the secret scan, so a leak cannot be published while its own check is red — exactly
# what happened on 0.8.12, where secret-scan failed on the same commit and the image
# went out anyway.
#
# One job per architecture, each on a runner of that architecture. arm64 used to be
# emulated on an x86 runner through setup-qemu; this Dockerfile compiles FFmpeg from
# source, so that leg ran 40+ minutes and was only ever cancelled by the next push.
# GitHub hosts arm64 runners natively for public repositories (ubuntu-24.04-arm), so
# each leg builds at native speed and the manifest is assembled afterwards.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Tag pushes ignore this list (GitHub does not evaluate path filters for tags), so
    # releases always build. See the header for what this deliberately does not cover.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Gate: a tag/main push must pass the same lint + tests as ci.yml before anything is
  # published. Keep this in sync with the `test` job there (Python 3.12 here because that
  # is the interpreter in the runtime image).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest
      # Release-day drift: `git tag v0.8.13 && git push --tags` from a tree that still
      # says 0.8.12 published an image whose :0.8.13 tag carried a 0.8.12 VERSION label
      # and a 0.8.12 changelog. Nothing caught it before this step. Skipped for branch
      # pushes, where main's version is legitimately ahead of or behind the last tag.
      - name: Tag name matches the package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -u
          # v0.8.12 -> 0.8.12 (a tag without the v prefix is accepted too).
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv run python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject [project].version $version"
            echo "tag:     $tag"
            echo "version: $version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches pyproject version $version"
      # Same script secret-scan.yml runs, so the two cannot drift. Until now the scan was
      # a sibling workflow: it went red five times on 0.8.12's commits and the image was
      # published anyway, because nothing made publication wait for it.
      - name: Secret scan (same rules as secret-scan.yml)
        run: bash scripts/secret_scan.sh

  # Each leg pushes a single-platform image by digest; nothing is tagged yet, so a
  # half-finished matrix never publishes a tag that points at one architecture only.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=rui
            org.opencontainers.image.licenses=MIT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Cache is scoped per architecture: an emulated x86 layer must never be served
          # to the arm64 leg, or the image silently contains the wrong binaries.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the tags once every architecture is in the registry. This is the only job
  # that writes a tag, so a failed leg leaves the previous :latest untouched.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # :latest is a release pointer, not a branch pointer: it must name the same
          # digest as :X.Y.Z, so it is emitted only for v* tag builds. main rolls :edge
          # (and :sha-<7>) instead, so an install that means "the released build"
          # cannot accidentally get an unreleased main commit. Version tags
          # (:X.Y.Z, :X.Y) are untouched: still semver-only, still tag-only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=rui
            org.opencontainers.image.licenses=MIT

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}')
          digest_args=$(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          docker buildx imagetools create $tag_args $digest_args

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
