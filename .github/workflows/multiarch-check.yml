name: multiarch-check

# TEMPORARY - proves both architectures build natively (no QEMU) on their own runners
# before the publish workflow is changed. Delete this file before merging.

on:
  push:
    branches: [fix/publish-native-arm]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build only (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: rui:check-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify the binary really is ${{ matrix.arch }}
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} rui:check-${{ matrix.arch }} \
            sh -c 'uname -m; ffmpeg -version | head -1'
