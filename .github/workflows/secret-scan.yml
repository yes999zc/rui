name: secret-scan

# A public-repo failure mode that is cheap to prevent: one pasted key, one absolute
# laptop path or one LAN address in a commit and the value is in the history forever.
# This runs on every push and every PR, scans tracked files only, and is deliberately a
# separate workflow from ci.yml so a leak has its own failing check name.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credential-shaped strings
        shell: bash
        run: |
          set -u

          # Two classes, because they carry different risk:
          #  - hard: something that authenticates (an sk- key, a bearer token, a value
          #    assigned to a passw[o]rd field), or an absolute home path that fingerprints
          #    this machine.
          #  - soft: a raw RFC1918 address. Only telling in aggregate (LAN topology), and
          #    netguard's own tests must use private ranges to prove private-address
          #    blocking works, so tests/ is exempt from this class and from nothing else.
          #
          # Neither class matches a CIDR such as 192.168.0.0/24. A documented policy example
          # is not a host address; flagging it made every netguard doc a permanent failure.
          hard='sk-[A-Za-z0-9]{16,}|[/]Users[/]|password[[:space:]]*[:=]|Bearer [A-Za-z0-9_-]{20,}'
          soft='(^|[^0-9.])192\.168\.[0-9]{1,3}\.[0-9]{1,3}([^0-9/]|$)|(^|[^0-9.])10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}([^0-9/]|$)'

          # Redacted samples written up by an audit, and the binary fixtures, are
          # intentionally fake. Everything else must be reviewed rather than excluded
          # by directory, so a real leak in docs/ or src/ is still found.
          git grep -nIE "$hard" -- . \
            ':(exclude)docs/*audit*' \
            ':(exclude)tests/fixtures/*' > hard.txt || true
          git grep -nIE "$soft" -- . \
            ':(exclude)docs/*audit*' \
            ':(exclude)tests/fixtures/*' \
            ':(exclude)tests/*' > soft.txt || true
          cat hard.txt soft.txt > scratch.txt
          rm -f hard.txt soft.txt

          # Reviewed benign matches, one line of evidence each:
          # - placeholder LAN addresses in the console UI;
          # - a type annotation (`...user: str, passw[o]rd: str`);
          # - the GITHUB_TOKEN reference in the publish workflow.
          # The regexes spell the sensitive words with a character class so this file
          # does not match the scan itself.
          grep -vE \
            -e '^web/src/i18n\.ts:[0-9]+:.*192[.]168[.]1[.](10|20|23)' \
            -e '^web/src/components/DeviceManager\.vue:[0-9]+:.*192[.]168[.]1[.]23' \
            -e '^web/src/components/BlockCredentials\.vue:' \
            -e '^web/src/api\.ts:[0-9]+:.*has_password' \
            -e '^src/rui/music/sources/navidrome[.]py:[0-9]+:def _token_auth[(]user: str, passw[o]rd: str[)]' \
            -e '^[.]github/workflows/docker-publish[.]yml:[0-9]+:.*passw[o]rd: [$][{][{] secrets[.]GITHUB_TOKEN [}][}]' \
            scratch.txt > findings.txt || true
          rm -f scratch.txt

          if [ -s findings.txt ]; then
            echo "::error::possible credential material in tracked files (see below)"
            cat findings.txt
            rm -f findings.txt
            exit 1
          fi
          rm -f findings.txt
          echo "secret-scan: clean"
