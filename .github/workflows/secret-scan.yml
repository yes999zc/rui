name: secret-scan

# A public-repo failure mode that is cheap to prevent: one pasted key, one absolute
# laptop path or one LAN address in a commit and the value is in the history forever.
# This runs on every push and every PR, scans tracked files only, and is deliberately a
# separate workflow from ci.yml so a leak has its own failing check name.
#
# The rules and exclude paths live in scripts/secret_scan.sh, not inline here:
# docker-publish's `test` gate runs the exact same script before it builds, so a leak
# cannot be published while this check is red (that happened on 0.8.12: the scan failed
# five times and the image went out anyway). Edit the script, not this file.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credential-shaped strings
        shell: bash
        run: bash scripts/secret_scan.sh
