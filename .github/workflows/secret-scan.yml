name: secret-scan

# A public-repo failure mode that is cheap to prevent: one pasted key, one absolute
# laptop path or one LAN address in a commit and the value is in the history forever.
# This runs on every push and every PR, scans tracked files only, and is deliberately a
# separate workflow from ci.yml so a leak has its own failing check name.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credential-shaped strings
        shell: bash
        run: |
          set -u

          # sk-... API keys, absolute macOS home paths, private LAN addresses
          # (192.168/16 and 10/8), assignments of a value to a "passw[o]rd" field,
          # and long bearer tokens.
          patterns='sk-[A-Za-z0-9]{16,}|[/]Users[/]|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|\b10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|password[[:space:]]*[:=]|Bearer [A-Za-z0-9_-]{20,}'

          # Redacted samples written up by an audit, and the binary fixtures, are
          # intentionally fake. Everything else must be reviewed rather than excluded
          # by directory, so a real leak in tests/ or docs/ is still found.
          git grep -nIE "$patterns" -- . \
            ':(exclude)docs/*audit*' \
            ':(exclude)tests/fixtures/*' > scratch.txt || true

          # Reviewed benign matches, one line of evidence each:
          # - placeholder LAN addresses in the console UI and docs;
          # - a type annotation (`...user: str, passw[o]rd: str`);
          # - the GITHUB_TOKEN reference in the publish workflow;
          # - private-IP fixtures in a config test.
          # The regexes spell the sensitive words with a character class so this file
          # does not match the scan itself.
          grep -vE \
            -e '^web/src/i18n\.ts:[0-9]+:.*192[.]168[.]1[.](10|20|23)' \
            -e '^web/src/components/DeviceManager\.vue:[0-9]+:.*192[.]168[.]1[.]23' \
            -e '^tests/test_config\.py:[0-9]+:.*10[.]0[.]0[.][0-9]+' \
            -e '^src/house_ear/music/sources/navidrome[.]py:[0-9]+:def _token_auth[(]user: str, passw[o]rd: str[)]' \
            -e '^[.]github/workflows/docker-publish[.]yml:[0-9]+:.*passw[o]rd: [$][{][{] secrets[.]GITHUB_TOKEN [}][}]' \
            scratch.txt > findings.txt || true
          rm -f scratch.txt

          if [ -s findings.txt ]; then
            echo "::error::possible credential material in tracked files (see below)"
            cat findings.txt
            rm -f findings.txt
            exit 1
          fi
          rm -f findings.txt
          echo "secret-scan: clean"
