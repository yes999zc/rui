# What `rui setup` writes on a fresh install (production: /config/config.yaml).
#
# Every value here is one we run: the capture/voice/playback numbers are the
# measured values of the reference speaker (a device plug's manifest may override
# them with its own audio_defaults), the provider chains are the order production uses (local
# ASR first, 讯飞 TTS first with SiliconFlow behind it, DeepSeek for the LLM),
# and the model directories are where `rui fetch-models` puts the files.
# One field is deliberately absent: `audio.capture.rate`. Leaving it out lets each
# plug's manifest declare its native wire rate (48 kHz for an 8 ch array speaker,
# 16 kHz for a mono one). See the comment inside the capture block and
# docs/audio-pipeline.md.
# `{config_dir}` is replaced by setup with the directory the config lives in.
#
# The two things you still add by hand on a cold install:
#   devices:  - your speaker (id/adapter/host/room/wake_words)
#   .env:     - RUI_LLM_KEY / RUI_ASR_KEY / XFYUN_* / VOLC_API_KEY
#               (plus XFYUN_APPID / XFYUN_API_KEY / XFYUN_API_SECRET for 讯飞 TTS;
#                VOLC_API_KEY for 火山豆包 TTS / ASR; VOLC_ACCESS_KEY_ID +
#                VOLC_SECRET_ACCESS_KEY only for the console's quota card)
version: 2
system:
  data_dir: /var/lib/rui
  log_level: info
web:
  host: 0.0.0.0
  port: 8080
  # `rui setup` fills this with a random token; the console asks for it.
  # An empty token on 0.0.0.0 refuses to start unless allow_anonymous is true.
  auth_token: ""
  allow_anonymous: false
  # Compatibility only since 0.8.0: the value is ignored. `/` always answers a 302 to
  # `/v2/`; the old panel shell is gone (its paths are 404), and there is no rollback.
  console: v2
security:
  # Outbound SSRF guard for HA, generic MCP, Navidrome and web search. The console
  # operator is trusted; the risk is a URL injected through tool output / remote config.
  # Cloud metadata, link-local, multicast, unspecified and reserved addresses are
  # always blocked. Private LAN services stay allowed by default; loopback is not.
  # See docs/security.md. Changes need a restart.
  outbound:
    enabled: true
    allow_private: true
    allow_loopback: false
    extra_allowed_hosts: []
    extra_allowed_cidrs: []
    blocked_hosts: []
    blocked_cidrs: []
devices: []
audio:
  # Measured on the reference speaker (firmware 1.94.13). Do not copy these numbers
  # to another speaker; measure it.
  capture:
    # No `rate` on purpose: the device plug manifest's native rate wins.
    # A `rate` written here is an operator wire negotiation and *beats* the manifest -
    # the device then resamples for us. Write `rate: 16000` only to save bandwidth:
    # it cuts the PCM payload to ~256 KB/s (on-wire bytes depend on the frame encoding)
    # but the speaker's own 48k->16k resample measured ~15 dB down in the speech band
    # and ASR stopped finishing (docs/audio-pipeline.md).
    channels: 8
    mic_channels: 6
    ref_channels: 2
    bits: 32
    mic_shift: 12            # the device sends 2**23-scaled samples; >>12 leaves 4 bits
    ref_shift: 16            # reference is 2**28: level-matched at 13, 16 adds headroom
  voice:
    rate: 16000
    frame_ms: 20
    vad_min_speech_ms: 200
    vad_end_silence_ms: 600
    vad_preroll_ms: 350
    wake_skip_ms: 300
    barge_in: true
    kws_enabled: true
    kws_model_dir: /data/models/kws/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
    kws_keywords_file: "{config_dir}/keywords.txt"
    kws_probe_file: ""       # a second spotter at a lower threshold that only logs
    kws_chunk: 8
    kws_num_threads: 1
    vad_model_path: /data/models/silero_vad.onnx
    wake_preroll_ms: 500
  # The reference client plays mono frames; 16 kHz is the rate the whole pipeline runs at.
  # Asking for 48 kHz here is rejected by the adapter (channels must be 1).
  playback:
    rate: 16000
    channels: 1
    queue_ms: 200
    fade_out_ms: 120
    credit_window: 8
    target_silence_ms: 300
  aec:
    enabled: true
    filter_len: 4096
    cancel: mix
ack:
  # Spoken cue by default (9哥's choice after the V2 work); `earcon` is the tone.
  mode: tts
  text: 在呢。
  # A barge wake gets one short earcon (same `chime`/`chime_trim`, capped short)
  # instead of the spoken cue, so it does not cover the sentence already in progress.
  # false = the old silent barge. A config without this key behaves as true.
  barge_ack: true
  chime: soft2
  chime_ms: 320
  chime_trim: 1.0
  max_ms: 600
  echo_ignore_ms: 1200
assistant:
  name: 小瑞
  # persona / system_prompt accept {name}, {max_chars}, {long_chars}, {version}
  # (this build, read-only) and {config_version} (not written below: it is not a knob).
  persona: "你是家里的小助理，叫{name}，跑在 rui {version} 上（家里自建的语音服务，不是 Home Assistant）。不知道就说不知道，别装懂。"
  system_prompt: ""
  filler_after_s: 1.8
  filler_after_tool_s: 0.6
  filler_text: 我查一下。
  reply_max_chars: 120
  reply_max_chars_search: 300
  reply_max_chars_long: 900
session:
  vendor_quiet_s: 12
  timeout_s: 15
  farewell: short
  farewell_text: 没事的话，我先下啦。
  farewell_text_full: 我先下啦，有事喊我。
  keep_context: true
  history_rounds: 6
providers:
  catalog:
    # Local ASR: fetch-models writes the 239 MB int8 model here; answers in ~50 ms
    # warm. Without it the chain falls through to the cloud entry.
    local_asr:
      kind: sherpa
      model: /data/models/sensevoice
      threads: 2
    volc_asr:
      kind: volc_asr              # 豆包流式语音识别 2.0（可选；填 VOLC_API_KEY 后把 asr.chain 换上）
      model: volc.seedasr.sauc.duration
      api_key_env: VOLC_API_KEY
      timeout_s: 15.0
    siliconflow_asr:
      kind: openai_compat
      base_url: https://api.siliconflow.cn/v1
      model: FunAudioLLM/SenseVoiceSmall
      api_key_env: RUI_ASR_KEY
      timeout_s: 8.0
      retries: 1
    xfyun_tts:
      kind: xfyun
      voice: x4_lingxiaowan_boy
      app_id_env: XFYUN_APPID
      api_key_env: XFYUN_API_KEY
      api_secret_env: XFYUN_API_SECRET
    volc_tts:
      kind: volc_tts
      retries: 1                  # one quick retry before falling back to another voice
      model: seed-tts-2.0          # picks the 2.0 voice + billing item
      voice: zh_female_xiaohe_uranus_bigtts   # 小荷 2.0; the console can audition others
      speech_rate: 0               # -50..100: -50 = 0.5x, 0 = normal, 100 = 2x
      emotion: ""                  # only some 2.0 voices; "" = vendor default
      emotion_scale: 4             # 1..5 strength, used when emotion is set
      api_key_env: VOLC_API_KEY
      timeout_s: 15.0
    deepseek_llm:
      kind: openai_compat
      base_url: https://api.deepseek.com
      model: deepseek-flash
      api_key_env: RUI_LLM_KEY
      timeout_s: 30.0
      max_tokens: 3000
      temperature: 0.4
      thinking: disabled     # measured: thinking doubles latency for no accuracy gain
  asr:
    chain: [local_asr, siliconflow_asr]
  tts:
    chain: [xfyun_tts, volc_tts]
  llm:
    chain: [deepseek_llm]
tools:
  expose: domain
  whitelist: []
  mcp_servers: []
  weather:
    city: ""                 # empty = the assistant asks instead of guessing
    days_max: 3
  news:
    enabled: true
  search:
    enabled: false           # needs DEEPSEEK_API_KEY; turn on once the key is in .env
    kind: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    count: 6
  ha:
    base_url: ""
    token_env: RUI_HA_TOKEN
    # The list injected into the prompt (names + ids only, never states). Defaults are
    # the safe, small set: script stays out because calls to it are refused, and the cap
    # plus the exclude regexes keep the block from crowding out the prompt.
    context: true              # false = no entity list in the prompt
    context_domains: [light, switch, cover]
    entity_cap: 120            # 1-1000; truncation happens after the exclude rules
    context_exclude: []        # case-insensitive regex against name or entity id, e.g. ["Camera Control"]
    # Scene entity ids the model may activate, matched exactly (the friendly name is
    # display-only and is injected as its own prompt segment). Empty = every scene call
    # is refused, i.e. the 0.8.10 behaviour. lock/alarm/valve/script/automation/
    # shell_command/python_script/hassio stay refused whatever is listed here.
    allowed_scenes: []         # e.g. [scene.example_scene, scene.example_away]
    # Per control call budget in seconds (2-20, default 10). Multi-entity calls go out
    # serially in batches of at most 8; after a timeout the state is read back before
    # speaking. 20 is the turn's tool timeout: anything larger is cancelled by the turn
    # first, so the schema rejects it instead of silently cutting it down.
    call_timeout_s: 10.0
  # `local.look` (0.8.11): one camera frame, described in 1-2 sentences by the model.
  # The frame is memory-only (never written to disk) and is sent as base64 to the
  # configured LLM endpoint (every provider on the LLM chain sees it until one
  # answers), so a look leaves this machine. 1 look per cooldown_s.
  vision:
    # The operator-run USB snapshot service on the Mac
    # (scripts/usb_snapshot_server.py, default port 8766). Empty = no USB camera:
    # the assistant says 「书房那台摄像头还没接上。」 instead of inventing a scene.
    # For a container/cross-machine setup start the script with `--host 0.0.0.0` and
    # point this at the Mac's LAN address; that endpoint has NO auth (see
    # docs/local-look.md §5 for the exposure this implies).
    usb_snapshot_url: ""       # e.g. http://<mac-lan-ip>:8766/snapshot.jpg
    # Spoken alias -> Home Assistant camera entity id. The frame comes from HA's
    # camera_proxy (the last frame it kept), so the reply says 「最近一次」.
    # Empty by default: no alias resolves until a deployment writes its own map.
    cameras: {}                # e.g. {"门口": "camera.example_door"}
    timeout_s: 15.0            # 1-30 s for the WHOLE look: fetch + description share it
    cooldown_s: 10.0           # 0-120 s between two looks (0 = no limit)
music:
  # Off until a Navidrome/Subsonic server exists: the credentials file must be
  # provisioned first (url/user/password), never in this file.
  enabled: false
  source: navidrome
  secrets_path: ""
  cache_dir: /var/lib/rui/music_cache
  cache_tracks: 8
  queue_min_tracks: 2
  queue_batch: 20
  history_max: 60
  resume_hold_ms: 2500   # 打断后多少毫秒恢复播放（0 = 答完立刻）
