name: rui

services:
  rui:
    # Pin a release in production. install.sh passes RUI_IMAGE, and .env can hold it
    # for good: RUI_IMAGE=ghcr.io/yes999zc/rui:0.2.2
    # `latest` is the rolling default, not the only recommendation - a tag or a digest is
    # what makes a rollback (and a bug report) reproducible. See docs/runbook.md.
    image: ${RUI_IMAGE:-${HOUSE_EAR_IMAGE:-ghcr.io/yes999zc/rui:latest}}
    container_name: rui
    restart: unless-stopped
    network_mode: host          # device audio is a long-lived socket; host avoids NAT surprises
    # The image's USER is rui (1000:1000); spelling it here keeps the host ownership
    # contract visible and lets an existing install override the pair. install.sh writes
    # RUI_UID/RUI_GID to .env and chowns ./config + ./data to match. An existing install
    # upgrading to this file must run:
    #   sudo chown -R 1000:1000 ~/rui/config ~/rui/data
    # A bare `docker compose up -d` on root-owned volumes otherwise fails to write.
    user: "${RUI_UID:-1000}:${RUI_GID:-1000}"
    env_file:
      - .env
    volumes:
      # Three volumes, three jobs. Everything that must survive `docker rm` lives on one
      # of them; nothing else in the container is worth keeping.
      - ./config:/config                              # config.yaml (the source of truth)
      - ./data:/var/lib/rui                           # system.data_dir: service.log,
                                                       #   secrets.yaml, memory/history, cache
      # fetch-models writes /data/models/<name> and the example config points providers at
      # /data/models/...; without this mount the model sits in the data volume while the
      # config points at a path that does not exist. Same host directory, second mount
      # point, so `./data/models` is both persistent and at the documented path.
      - ./data/models:/data/models
    environment:
      RUI_CONFIG: /config/config.yaml
      RUI_WEB_DIR: /app/web/dist
      # Everything the old image wrote under /root/.local/state now lives on the data
      # volume. The image sets these defaults too; they are repeated here so a
      # deployment can see (and override) the state location without inspecting the
      # Dockerfile. Keep a custom RUI_STATE_DIR inside /var/lib/rui or the audio-plane
      # socket will not survive a container rebuild.
      # RUI_STATE_DIR moves both consumers at once; the two concrete paths can still be
      # overridden individually (nested defaults are supported by compose interpolation).
      RUI_STATE_DIR: ${RUI_STATE_DIR:-/var/lib/rui/state}
      RUI_AUDIO_SOCK: ${RUI_AUDIO_SOCK:-${RUI_STATE_DIR:-/var/lib/rui/state}/audio.sock}
      RUI_CHANNEL_DATA: ${RUI_CHANNEL_DATA:-${RUI_STATE_DIR:-/var/lib/rui/state}/channels}
      HOME: /var/lib/rui
    # /app is root-owned and never writable by the runtime user; the root filesystem is
    # read-only as well, so only the two bind mounts persist writes. /tmp is a small
    # tmpfs because ffmpeg/uvicorn and the schema's fallback music cache use it. These
    # options make the hardening explicit without a root entrypoint: the container cannot
    # gain privileges and starts with no Linux capabilities. Binding :8080/:4412 with
    # host networking needs no capability (they are >1024).
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Log rotation belongs to the runtime: the app's own service.log already rotates
    # (2 MB x 3) but stdout/stderr are the container's json-file log and would otherwise
    # grow without bound on a NAS nobody logs into daily.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The image has the same probe as its default HEALTHCHECK; spelling it out here keeps
    # the numbers with the deployment instead of hidden in the image.
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/rui-healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 90s           # ASR/KWS loads and filler rendering happen before serving
      retries: 3
    stop_grace_period: 20s        # let uvicorn drain a turn and the plane close its socket
