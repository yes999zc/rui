services:
  house-ear:
    # Pin a release in production. install.sh passes HOUSE_EAR_IMAGE, and .env can hold it
    # for good: HOUSE_EAR_IMAGE=ghcr.io/yes999zc/rui:0.0.1
    # `latest` is the rolling default, not the only recommendation - a tag or a digest is
    # what makes a rollback (and a bug report) reproducible. See docs/runbook.md.
    image: ${HOUSE_EAR_IMAGE:-ghcr.io/yes999zc/rui:latest}
    container_name: house-ear
    restart: unless-stopped
    network_mode: host          # device audio is a long-lived socket; host avoids NAT surprises
    env_file:
      - .env
    volumes:
      # Three volumes, three jobs. Everything that must survive `docker rm` lives on one
      # of them; nothing else in the container is worth keeping.
      - ./config:/config                              # config.yaml (the source of truth)
      - ./data:/var/lib/house-ear                     # system.data_dir: service.log,
                                                       #   secrets.yaml, memory/history, cache
      # fetch-models writes /data/models/<name> and the example config points providers at
      # /data/models/...; without this mount the model sits in the data volume while the
      # config points at a path that does not exist. Same host directory, second mount
      # point, so `./data/models` is both persistent and at the documented path.
      - ./data/models:/data/models
    environment:
      HOUSE_EAR_CONFIG: /config/config.yaml
      HOUSE_EAR_WEB_DIR: /app/web/dist
    # Log rotation belongs to the runtime: the app's own service.log already rotates
    # (2 MB x 3) but stdout/stderr are the container's json-file log and would otherwise
    # grow without bound on a NAS nobody logs into daily.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The image has the same probe as its default HEALTHCHECK; spelling it out here keeps
    # the numbers with the deployment instead of hidden in the image.
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/house-ear-healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 90s           # ASR/KWS loads and filler rendering happen before serving
      retries: 3
    stop_grace_period: 20s        # let uvicorn drain a turn and the plane close its socket
