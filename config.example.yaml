# The annotated production config. A real install gets this file from
# `rui setup` (see src/rui/config/template.yaml - same values, written
# with the host's paths); this copy is for reading and for a manual install.
version: 2
system:
  data_dir: /var/lib/rui
  log_level: info
web:
  host: 0.0.0.0
  port: 8080
  auth_token: ""        # setup generates one; fill it before exposing the console
  allow_anonymous: false  # true = no token on a non-loopback bind (dev only)          # set this if the console is reachable beyond your LAN
  # Compatibility only since 0.8.0: the value is ignored. `/` always answers a 302 to
  # `/v2/`; the old panel shell and its `/panel/*` links are gone (404), and there is
  # no rollback switch.
  console: v2
security:
  # Outbound SSRF guard for HA, generic MCP, Navidrome and web search. The console
  # operator is trusted; the risk is a URL injected through tool output / remote config.
  # Cloud metadata, link-local, multicast, unspecified and reserved addresses are
  # always blocked. Private LAN services stay allowed by default; loopback is not.
  # See docs/security.md. Changes need a restart.
  outbound:
    enabled: true
    allow_private: true
    allow_loopback: false
    extra_allowed_hosts: []
    extra_allowed_cidrs: []
    blocked_hosts: []
    blocked_cidrs: []
devices:
  - id: living
    adapter: lx06          # required since 0.8.0; the old "xiaoai" spelling is rejected
    host: speaker.local    # the speaker's LAN name or IP (mDNS is enough here)
    room: 客厅
    wake_words: ["你好小瑞"]
    # 45 ≈ 设备刻度 115（0-100 -> 0-255），仍可按遥控/按键在设备侧再调。
    volume: 45             # LX06 客厅实测 60 偏吵；dot2 不需要跟着降；生产改配置需 9哥 批准
    listen_port: 4412      # the speaker's client dials us here; omit to use the plug
                           # manifest's runtime.listen_port (required there since 0.8.0)
    token_env: RUI_DEVICE_TOKEN
    # The 18-LED ring. Off until you turn it on; colours are peak values, brightness is
    # applied when a frame is built. The rings are driven by writing sysfs through the
    # client's shell channel, never by blocking the audio stream.
    led:
      enabled: false
      gain: 1.9            # the old deployment tuned 2.45 on this hardware
      night_factor: 0.6    # 00:00-07:00 at 60%; the old deployment used 0.75
      night_start: 0
      night_end: 7
      fade_ms: 180
      colors:
        off: "#000000"
        listening: "#004800"
        thinking: "#000060"
        speaking: "#003048"
        wake: "#484848"
        error: "#480000"
        music: "#481860"
        music_paused: "#602800"
        muted: "#3C0000"

# 两台音箱：默认（enabled: false）只给配置里的第一台设备起音频平面；要让每台都起，
# 取消下面注释并保证 max_planes >= 设备数。`/health` 的 `planes` 会逐台显示
# running / error / not_started，`rui doctor` 在 devices>=2 且此处关闭时给 WARN。
# multi_device:
#   enabled: true
#   max_planes: 2
#   # 提醒没有指定房间时落在这台（D-013：living = 客厅）。指定房间离线也回落这里，
#   # 并会明确说「<room>那台没在线」。留空时优先用 enabled 的 id `living`（或房间
#   # 「客厅」），都没有才回落最近活跃房间（有 warning）。
#   default_output: living

audio:
  # Measured on LX06 1.94.13 - do not copy these numbers to another speaker, measure it.
  capture:
    # No `rate` here on purpose: the device plug manifest's native rate applies
    # (LX06 48000, Dot 2 16000). The bridge receives `record` as a binary websocket
    # frame whose JSON body carries the PCM in its `bytes` field: an int array (the
    # fork also accepts base64). The PCM itself is int16, 2 B/sample, so the payload
    # is 48 kHz x 8 ch = 768 KB/s (~6 Mbit/s) versus 256 KB/s (~2 Mbit/s) at 16 kHz;
    # the bytes on the wire are higher by the JSON encoding (int array ~3 MB/s,
    # base64 ~1 MB/s at 48 kHz). The old "6 MB/s" was the 32-bit figure: 1.5 MB/s of
    # PCM x the same ~4x encoding overhead.
    #
    # Writing `rate: 16000` here is a negotiation, not a hardware fact: the explicit
    # wire wins over the manifest and the speaker resamples 48k->16k itself. Measured
    # on the LX06 that costs ~15 dB in the speech band (segment rms 0.006/0.008 vs
    # 0.035 at 48 kHz) and leaves ASR idling or timing out. AEC/KWS/VAD still run at
    # 16 kHz internally, so write 16 kHz only when wifi bandwidth matters more than
    # ASR: it is the explicit option, never the default.
    channels: 8
    mic_channels: 6        # ch0..ch5
    ref_channels: 2        # ch6, ch7 (playback reference, needed for barge-in)
    bits: 32               # hardware bit depth; the client converts to 16 bit on the wire
    mic_shift: 12          # sent to the device; 8 clips loud speech, 12 leaves 4 bits
    ref_shift: 16          # reference is 2**28: >>13 is level-matched, 16 adds headroom
  voice:
    rate: 16000            # AEC / KWS / VAD run here, not at 48 kHz
    frame_ms: 20
    # Wake word. The real threshold is in the keywords file, not in this config
    # (`rui setup` generates it; `rui keywords` regenerates it when the
    # wake words change). Model comes from `rui fetch-models`.
    kws_enabled: true
    kws_model_dir: /data/models/kws/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
    kws_keywords_file: /config/keywords.txt
    kws_probe_file: ""
    kws_chunk: 8
    # Standby KWS gate (0.8.7/0.8.8, docs/standby-cpu-0.8.7.md): while nothing is
    # happening, the spotter is fed only while the mic is above the silence line
    # max(`standby_kws_db`, learned room floor + 6 dB). The room floor is tracked from
    # idle frames (fast down, slow EMA up), so playback echo cannot raise it; the first
    # frame above the line resumes the spotter and replays the preroll ring, so the wake
    # word's onset is not lost. `standby_kws_db` is the absolute lower bound and only
    # matters in very quiet rooms; use `standby_kws_hold_ms` as the main knob. Restart
    # the audio plane after edits.
    standby_kws_gate: true
    standby_kws_db: -60.0
    standby_kws_hold_ms: 1000
    vad_min_speech_ms: 200
    vad_end_silence_ms: 600
    # Audio kept from before the KWS hit and replayed into the gate. The streaming KWS
    # reports 150-200 ms after the wake word ends; without this the first word of a
    # request spoken in one breath ("你好小瑞，现在几点") never reaches the transcriber.
    wake_preroll_ms: 500
    # The turn gate. Empty = the gate never starts: the wake cue, the pre-wake replay and
    # every gate metric are then inert. `rui fetch-models` downloads it.
    vad_model_path: /data/models/silero_vad.onnx
    vad_preroll_ms: 350     # measured: 200 ms clips the first syllable, 350 does not
    wake_skip_ms: 300       # the wake phrase's own tail, dropped after the KWS fires
    barge_in: true
  playback:
    # The pipeline is 16 kHz mono end to end and the LX06 client plays mono frames
    # (48 kHz / 2 ch was an old assumption that raised on the first reply).
    rate: 16000
    channels: 1
    queue_ms: 200
    fade_out_ms: 120
    credit_window: 8       # blocks the plane may run ahead of the device's reports
    target_silence_ms: 300 # acceptance target for an interrupt
  aec:
    enabled: true
    filter_len: 4096       # taps at voice.rate = 256 ms of echo tail
ack:
  # What the speaker does the instant the wake word fires.
  # earcon = a 160 ms tone, no microphone loss. tts = a spoken word, but the LX06 mutes
  # its microphone for ~1.2 s while it plays, so the cue is capped and falls back to the
  # tone when the cap is exceeded.
  mode: tts              # none | earcon | tts (9哥 picked the spoken cue)
  text: 在呢。            # only used by mode: tts; rendered once at startup
  # A barge wake plays one short earcon (same chime/chime_trim below, capped to a
  # short length) instead of the spoken cue: the person is already talking. false =
  # silent barge (pre-0.9 behaviour); an old config without the key behaves as true.
  barge_ack: true
  chime: soft2           # soft2 | blip | marimba | glass | piano
  chime_ms: 160          # 0 = the preset's natural length (soft2 500, woodblock 120)
  chime_trim: 1.0        # 0..1: the cue is already at the level the path likes
  max_ms: 600            # a longer spoken cue is refused and the tone is used
  echo_ignore_ms: 1200   # how long the box ignores its own spoken cue (tts only)
assistant:
  # Who answers, and how long it may talk. The numbers are the old deployment's production
  # values: they were tuned against real answers, and the wording in session/prompts.py is
  # what made them work (raising the caps alone changed nothing).
  name: 小瑞
  persona: "你是家里的小助理，叫{name}。不知道就说不知道，别装懂。"
  system_prompt: ""      # non-empty replaces the built-in prompt entirely (console)
  reply_max_chars: 120   # one everyday answer
  reply_max_chars_search: 300   # an answer that used a tool (S5e); unused for now
  reply_max_chars_long: 900     # 背诵全文/详细讲解, one go, no "shall I continue"
session:
  vendor_quiet_s: 12     # stay quiet this long after 小爱 answered (yield, no farewell)
  history_rounds: 6      # rounds handed to the model; 4 made repeated questions collapse
providers:
  # One catalog of named providers; each stage picks an ordered chain (primary first).
  catalog:
    # Local ASR: `rui fetch-models` writes the model here (239 MB int8). First in the
    # chain because it answers in ~50 ms warm; when the model is absent the chain falls
    # through to the cloud entry and nothing else changes.
    local_asr:
      kind: sherpa
      model: /data/models/sensevoice
      threads: 2
    volc_asr:
      kind: volc_asr              # 豆包流式语音识别 2.0（可选；填 VOLC_API_KEY 后把 asr.chain 换上）
      model: volc.seedasr.sauc.duration
      api_key_env: VOLC_API_KEY
      timeout_s: 15.0
    siliconflow_asr:
      kind: openai_compat
      base_url: https://api.siliconflow.cn/v1
      model: FunAudioLLM/SenseVoiceSmall
      api_key_env: RUI_ASR_KEY
      timeout_s: 8.0
      retries: 1
    # Spoken TTS: 讯飞 primary (180-600 ms whole sentence). SiliconFlow TTS is defined
    # below for reference but no longer in the chain (9哥: remove it from TTS).
    xfyun_tts:
      kind: xfyun
      voice: x4_lingxiaowan_boy
      app_id_env: XFYUN_APPID
      api_key_env: XFYUN_API_KEY
      api_secret_env: XFYUN_API_SECRET
    # 火山豆包语音合成 2.0（可选；把 tts.chain 里的名字换上来才会用；推荐主用）
    volc_tts:
      kind: volc_tts
      retries: 1                  # one quick retry before falling back to another voice
      model: seed-tts-2.0
      voice: zh_female_xiaohe_uranus_bigtts
      speech_rate: 0        # -50..100 (-50 = 0.5x, 0 = normal, 100 = 2x)
      emotion: ""           # happy / sad / angry / ... (voice dependent)
      emotion_scale: 4      # 1..5 strength
      api_key_env: VOLC_API_KEY
      timeout_s: 15.0
    deepseek_llm:
      kind: openai_compat
      base_url: https://api.deepseek.com
      model: deepseek-flash
      api_key_env: RUI_LLM_KEY
      timeout_s: 30.0
      max_tokens: 3000
      temperature: 0.4
      thinking: disabled   # measured: thinking 2-3x latency, no accuracy gain
  asr:
    chain: [local_asr, siliconflow_asr]
  tts:
    chain: [xfyun_tts, volc_tts]
  llm:
    chain: [deepseek_llm]
tools:
  expose: domain
  whitelist: []
  # The three information tools a voice assistant needs on day one. Weather (open-meteo)
  # and news (public digest) need no key; search talks to any OpenAI-ish search endpoint.
  weather:
    city: ""               # your city; empty means the assistant asks instead of guessing
    days_max: 3            # 1 = today only, up to 3
  news:
    enabled: true
  search:
    enabled: true
    kind: deepseek         # deepseek | none
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY   # the key lives in env or secrets.yaml, never here
    count: 6
  # Jokes and riddles. The tool always answers: with no URL (or an unreachable one, or a
  # timeout) it serves the 20 bundled samples in src/rui/data/jokes.fallback.json.
  # A configured service is called as GET <url>/v1/joke with X-Internal-Token taken
  # from the JOKE_SERVICE_TOKEN secret (env or secrets.yaml; missing = no header).
  # The response may carry `audio_url`: rui downloads that clip (WAV only, 10 s, 8 MB)
  # into <data_dir>/tmp and plays it instead of TTS; a failed download uses the text.
  # Reaching a service on 127.0.0.1 needs security.outbound.allow_loopback: true (the
  # default is false); LAN/private addresses are allowed by default (allow_private).
  joke_service_url: ""       # e.g. http://joke-svc.example.lan:18081; empty = samples only
  joke_timeout_s: 3.0        # 0.5-10 seconds; past it the sample is served
  mcp_servers: []
  ha:
    base_url: ""
    token_env: RUI_HA_TOKEN
music:
  # Off until a Navidrome/Subsonic server is provisioned: point secrets_path at a
  # json with url/user/password (never in this file), then set enabled: true.
  enabled: false
  source: navidrome
  secrets_path: /var/lib/rui/lan_media.json
  cache_dir: /var/lib/rui/music_cache
  cache_tracks: 8
  queue_min_tracks: 2
  queue_batch: 20
  history_max: 60
  resume_hold_ms: 2500   # 打断后多少毫秒恢复播放（0 = 答完立刻）
