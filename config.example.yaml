version: 1
system:
  data_dir: /var/lib/house-ear
  log_level: info
web:
  host: 0.0.0.0
  port: 8080
  auth_token: ""          # set this if the console is reachable beyond your LAN
devices:
  - id: living
    adapter: xiaoai
    host: <LAN-IP>     # the speaker
    room: 客厅
    wake_words: ["你好小瑞"]
    volume: 60
audio:
  sample_rate: 16000
  frame_ms: 20
  aec:
    enabled: true
    filter_len: 4096
    channels: 6
    mic_shift: 8          # mics are 2**23 full scale
    ref_shift: 13         # reference is 2**28: >>8 here clips half the samples
  kws_threshold: 0.6
  vad_min_speech_ms: 200
  vad_end_silence_ms: 600
  barge_in: true
providers:
  asr:
    kind: openai_compat
    base_url: ""
    model: ""
    api_key_env: HOUSE_EAR_ASR_KEY
  tts:
    kind: openai_compat
    base_url: ""
    model: ""
    api_key_env: HOUSE_EAR_TTS_KEY
  llm:
    kind: openai_compat
    base_url: ""
    model: ""
    api_key_env: HOUSE_EAR_LLM_KEY
tools:
  expose: domain
  whitelist: []
  mcp_servers: []
  ha:
    base_url: ""
    token_env: HOUSE_EAR_HA_TOKEN
