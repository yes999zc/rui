version: 2
system:
  data_dir: /var/lib/house-ear
  log_level: info
web:
  host: 0.0.0.0
  port: 8080
  auth_token: ""          # set this if the console is reachable beyond your LAN
devices:
  - id: living
    adapter: xiaoai
    host: <LAN-IP>     # the speaker, reached over SSH for probing
    room: 客厅
    wake_words: ["你好小瑞"]
    volume: 60
    listen_port: 4400      # the speaker's client dials us here; None = adapter default
    token_env: HOUSE_EAR_DEVICE_TOKEN
audio:
  # Measured on LX06 1.94.13 - do not copy these numbers to another speaker, measure it.
  capture:
    rate: 48000            # /proc/asound: S32_LE, 8 ch, 48000 Hz
    channels: 8
    mic_channels: 6        # ch0..ch5
    ref_channels: 2        # ch6, ch7 (playback reference, needed for barge-in)
    bits: 32
    mic_shift: 8           # mics are 2**23 full scale
    ref_shift: 13          # reference is 2**28: >>8 here clips half the samples
  voice:
    rate: 16000            # AEC / KWS / VAD run here, not at 48 kHz
    frame_ms: 20
    kws_threshold: 0.20
    vad_min_speech_ms: 200
    vad_end_silence_ms: 600
    barge_in: true
  playback:
    rate: 48000            # measured: S16_LE, 2 ch
    channels: 2
    queue_ms: 200
    fade_out_ms: 120
    target_silence_ms: 300 # acceptance target for an interrupt
  aec:
    enabled: true
    filter_len: 4096       # taps at voice.rate = 256 ms of echo tail
providers:
  # One catalog of named providers; each stage picks an ordered chain (primary first).
  catalog:
    siliconflow:
      kind: openai_compat
      base_url: https://api.siliconflow.cn/v1
      api_key_env: HOUSE_EAR_ASR_KEY
    siliconflow_llm:
      kind: openai_compat
      base_url: https://api.siliconflow.cn/v1
      model: deepseek-ai/DeepSeek-V3
      api_key_env: HOUSE_EAR_LLM_KEY
    siliconflow_tts:
      kind: openai_compat
      base_url: https://api.siliconflow.cn/v1
      model: FunAudioLLM/CosyVoice2-0.5B
      voice: alex
      api_key_env: HOUSE_EAR_TTS_KEY
  asr:
    chain: [siliconflow]
  tts:
    chain: [siliconflow_tts]
  llm:
    chain: [siliconflow_llm]
tools:
  expose: domain
  whitelist: []
  mcp_servers: []
  ha:
    base_url: ""
    token_env: HOUSE_EAR_HA_TOKEN
