# 两台音箱、一套 rui —— 新手安装路径的最小示例 / two speakers, one rui.
#
# 用法 / Usage（**先进入本目录**：下面所有 ./ 都是相对本文件解析的）:
#   cd examples/two-speakers
#   1. 把两个桥仓的插件源码放到 ./plugins/ 下：
#        git clone --branch v1.3.1 https://github.com/yes999zc/rui-dot2-bridge.git
#        git clone --branch v0.2.2 https://github.com/yes999zc/rui-xiaoai-bridge.git
#        mkdir -p plugins && cp -r rui-dot2-bridge/src/rui_dot2_bridge plugins/
#        cp -r rui-xiaoai-bridge/src/rui_xiaoai_bridge plugins/
#   2. 准备 ./config/config.yaml（web.auth_token + devices[]，lx06 必填 host）
#   3. docker compose up -d      # 或 docker compose -f <本文件> --project-directory . up -d
#   4. curl -s localhost:8080/health | python3 -c 'import json,sys;d=json.load(sys.stdin);
#        print({k:d[k] for k in ("version","devices","device_errors","audio_plane","adapter_plugins")})'
# 注意：deploy/install.sh 会自己起一套 8080 的实例，**不要与这个 compose 同时用**
#
# 实测（2026-10-27，rui 0.7.8 纯净装）：`adapter_plugins.registered=["dot2","lx06"]`、
# `devices=2`、`device_errors=0`、`planes` 两台 running。
services:
  rui:
    # 0.7.8 amd64 平台摘要（老版 docker 不认 OCI index，见 README 兼容性）
    image: ghcr.io/yes999zc/rui@sha256:1f074bb3af1ef4854ef040b12c9146ed8a6ef2b1c4a5f6cc7858ac6ccac3ecaa
    container_name: rui
    restart: unless-stopped
    ports:
      - "8080:8080"                        # 控制台 /v2 与 API
    volumes:
      - ./config:/config:ro                # config.yaml：唯一事实来源（web.auth_token 必须在这里）
      - ./data:/var/lib/rui                # 状态、secrets.yaml、日志、音乐缓存
      # TLS 材料（dot2 的 tls_port 开启时必需）：有原 controller 证书就拷贝到 ./secrets/；
      # 没有就运行 `bash ../../scripts/make_dev_tls.sh` 自签。自签只保证平面能起，
      # 真机是否接受取决于设备信任的 CA（见 README「TLS 材料」与 docs/audit/tls-required-2026-10.md）。
      - ./secrets:/opt/rui-secrets:ro
      # 两个桥的插件源码：git clone 两个桥仓后，把 src 下的包放到这里
      - ./plugins/rui_dot2_bridge:/opt/rui-plugins/rui_dot2_bridge:ro
      - ./plugins/rui_xiaoai_bridge:/opt/rui-plugins/rui_xiaoai_bridge:ro
    environment:
      RUI_CONFIG: /config/config.yaml       # 核心默认在 /var/lib/rui，这里显式指到挂载点
      RUI_WEB_DIR: /app/web/dist            # 镜像内的控制台构建产物
      PYTHONPATH: /opt/rui-plugins          # 让两个插件包可 import
      # 设备令牌：lx06 的设备清单用 token_env=RUI_DEVICE_TOKEN，dot2 用 DOT2_EM_TOKEN。
      # 留空时音频平面不会启动（/health 里 audio_plane=false，日志 "RUI_DEVICE_TOKEN is empty"）
      RUI_DEVICE_TOKEN: ${RUI_DEVICE_TOKEN:-}
      DOT2_EM_TOKEN: ${DOT2_EM_TOKEN:-}
      DOT2_SECRETS_DIR: /opt/rui-secrets    # 与上面的 ./secrets 挂载对应
      # adapter id -> 入口；右侧必须与 plugins/ 下的包名一致
      RUI_ADAPTER_PLUGINS: "dot2=rui_dot2_bridge.adapter:build,lx06=rui_xiaoai_bridge.adapter:build"
